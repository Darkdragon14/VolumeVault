
# Keep agent traffic off the web listener, including before PHP regex locations.
location = /agent/v1 {
    return 404;
}

location ^~ /agent/v1/ {
    return 404;
}

# Laravel also accepts front-controller-prefixed paths.
location = /index.php/agent/v1 {
    return 404;
}

location ^~ /index.php/agent/v1/ {
    return 404;
}
