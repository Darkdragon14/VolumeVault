services:
  volumevault:
    image: volumevault:local
    build: .
    ports:
      - "8080:8080"
    volumes:
      - volumevault_data:/app/storage
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY before starting VolumeVault}
      DOCKER_HOST: ${VOLUMEVAULT_DOCKER_HOST:?Set VOLUMEVAULT_DOCKER_HOST to your private TCP socket proxy endpoint}
    restart: unless-stopped

volumes:
  volumevault_data:
